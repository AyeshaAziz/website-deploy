name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: itqa
          POSTGRES_PASSWORD: itqa
          POSTGRES_DB: itqa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itqa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://itqa:itqa@localhost:5432/itqa?schema=public
      JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      SEED_ADMIN_EMAIL: admin@itqa.local
      SEED_ADMIN_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # TODO: deploy job (staging on merge to main, production on approval) once Terraform is applied
